<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" aria-labelledby="title desc">
  <title id="title">awaken skill — iteration 1 benchmark (pass rate %)</title>
  <desc id="desc">Grouped bar chart comparing with-skill vs baseline pass rates across three evals. Mean: with-skill 92.6%, baseline 51.8%, delta plus 40.8 percentage points.</desc>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#111">awaken skill — iteration 1 benchmark (pass rate %)</text>
  <text x="450" y="64" text-anchor="middle" font-size="14" fill="#555">Mean: with-skill 92.6% &#xa0;·&#xa0; baseline 51.8% &#xa0;·&#xa0; Δ +40.8 pp</text>

  <!-- Plot area: x 90-860, y 100-420 (chart height 320, chart width 770) -->
  <!-- Y axis grid + labels (0, 25, 50, 75, 100) -->
  <g stroke="#e4e4e4" stroke-width="1">
    <line x1="90" y1="420" x2="860" y2="420"/>
    <line x1="90" y1="340" x2="860" y2="340"/>
    <line x1="90" y1="260" x2="860" y2="260"/>
    <line x1="90" y1="180" x2="860" y2="180"/>
    <line x1="90" y1="100" x2="860" y2="100"/>
  </g>
  <g font-size="12" fill="#666" text-anchor="end">
    <text x="82" y="424">0%</text>
    <text x="82" y="344">25%</text>
    <text x="82" y="264">50%</text>
    <text x="82" y="184">75%</text>
    <text x="82" y="104">100%</text>
  </g>

  <!-- Y axis line -->
  <line x1="90" y1="100" x2="90" y2="420" stroke="#444" stroke-width="1.5"/>
  <!-- X axis line -->
  <line x1="90" y1="420" x2="860" y2="420" stroke="#444" stroke-width="1.5"/>

  <!-- Y axis label -->
  <text x="30" y="260" font-size="13" fill="#333" text-anchor="middle" transform="rotate(-90 30 260)">pass rate (%)</text>

  <!-- Bars
       3 groups, each 770/3 ≈ 256.67 wide. Group centers at x = 90 + 128.3, 90+128.3+256.67, 90+128.3+2*256.67 = 218.3, 475, 731.7
       Inside each group: 2 bars (with-skill, baseline), bar width 70, gap 8, so group-inner-width = 148. Center bars around group center.
       y-scale: pass_rate 1.0 -> y=100, pass_rate 0 -> y=420. height = pass_rate * 320.
  -->

  <!-- Group 1: Eval-0 Code architecture  with 89, baseline 33 -->
  <g>
    <!-- with-skill bar: 89% -> height 284.8, y = 420-284.8 = 135.2 -->
    <rect x="180" y="135" width="70" height="285" fill="#2e7d32" rx="3"/>
    <text x="215" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">89%</text>
    <!-- baseline bar: 33% -> height 105.6, y = 420-105.6 = 314.4 -->
    <rect x="258" y="314" width="70" height="106" fill="#c62828" rx="3"/>
    <text x="293" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">33%</text>
  </g>

  <!-- Group 2: Eval-1 RAG medical  with 89, baseline 44 -->
  <g>
    <!-- with-skill bar: 89% -> height 285 -->
    <rect x="437" y="135" width="70" height="285" fill="#2e7d32" rx="3"/>
    <text x="472" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">89%</text>
    <!-- baseline bar: 44% -> height 140.8, y = 279.2 -->
    <rect x="515" y="279" width="70" height="141" fill="#c62828" rx="3"/>
    <text x="550" y="269" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">44%</text>
  </g>

  <!-- Group 3: Eval-2 Code review culture  with 100, baseline 78 -->
  <g>
    <!-- with-skill bar: 100% -> height 320, y = 100 -->
    <rect x="694" y="100" width="70" height="320" fill="#2e7d32" rx="3"/>
    <text x="729" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">100%</text>
    <!-- baseline bar: 78% -> height 249.6, y = 170.4 -->
    <rect x="772" y="170" width="70" height="250" fill="#c62828" rx="3"/>
    <text x="807" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">78%</text>
  </g>

  <!-- X-axis group labels -->
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="254" y="445" font-weight="600">Eval 0</text>
    <text x="254" y="463" fill="#555">Code architecture</text>
    <text x="254" y="478" fill="#555">(pub/sub vs streaming)</text>

    <text x="511" y="445" font-weight="600">Eval 1</text>
    <text x="511" y="463" fill="#555">RAG medical</text>
    <text x="511" y="478" fill="#555">(vector vs graph vs hybrid)</text>

    <text x="768" y="445" font-weight="600">Eval 2</text>
    <text x="768" y="463" fill="#555">Code review culture</text>
    <text x="768" y="478" fill="#555">(diagnostic, Chinese)</text>
  </g>

  <!-- Legend -->
  <g font-size="13" fill="#222">
    <rect x="320" y="496" width="18" height="14" fill="#2e7d32" rx="2"/>
    <text x="344" y="508">with-skill</text>
    <rect x="440" y="496" width="18" height="14" fill="#c62828" rx="2"/>
    <text x="464" y="508">baseline (no skill)</text>
  </g>
</svg>
